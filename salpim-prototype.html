function checkinContent(){if(step===0)return `<div class="steps"><b>01 마음 고르기</b><span>02 이야기하기</span><span>03 선물 받기</span></div><h2>${period==='am'?'지금 내 마음은 무슨 색일까?':'오늘 학교에서 어떤 기분이었어?'}</h2><p class="small" style="margin-top:9px">지금 마음과 가장 가까운 색을 골라 줘.</p><div class="moods">${moods.map((m,i)=>`<button class="mood ${mood===i?'selected':''}" aria-pressed="${mood===i}" onclick="mood=${i};$('#checkinBody').innerHTML=checkinContent()"><span class="face">•${m[3]}•</span>${m[0]}</button>`).join('')}</div><div class="moodhint">${mood<0?'어떤 색을 골라도 괜찮아.':moods[mood][1]}</div><button class="primary full" onclick="nextMood()">이 마음으로 이야기하기 →</button>`;
if(step===1)return `<div class="steps"><span>01 마음 고르기 ✓</span><b>02 이야기하기</b><span>03 선물 받기</span></div><h2>네 이야기를 들려줘.</h2><div class="chatbubble"><b style="font-size:13px">✿ 살핌이</b><p>${moods[mood][2]}</p></div><label class="small" for="answer">${period==='pm'?'오늘 학교에서 털어놓고 싶은 이야기':'이 색을 고른 이유'}</label><textarea id="answer" rows="3" style="margin-top:8px" placeholder="예) 어제 축구를 했는데 너무 재밌었어요.">${esc(answer)}</textarea><button class="primary full" style="margin-top:15px" onclick="sendStory()">이야기 들려주기 →</button><button style="font-size:13px;margin-top:12px;color:#7d8978" onclick="step=0;renderChild()">← 색 다시 고르기</button>`;
if(step===2)return `<div class="steps"><span>01 마음 고르기 ✓</span><b>02 이야기하기</b><span>03 선물 받기</span></div><h2>이야기해 줘서 고마워.</h2><div class="reply">${esc(answer)}</div><div class="chatbubble"><b style="font-size:13px">✿ 살핌이</b><p>${esc(chatReply)}</p><p style="margin-top:8px">이 이야기를 선생님과도 나누고 싶어?</p></div><div class="flex"><button class="secondary full" onclick="requestMeeting()">${requestSent?'면담 신청했어요 ✓':'선생님께 면담 신청'}</button></div><button class="primary full" style="margin-top:14px" onclick="finishStory()">대화 마치고 선물 받기 ✦</button><p class="small" style="text-align:center;margin-top:13px">AI 대화 예시 · 실제 AI와 연결되지 않았어요</p>`;
const r=completed[period];return `<div class="reward"><div class="tag">오늘의 ${period==='am'?'첫 번째':'하교'} 이야기 완료</div><div class="big">${r?r.icon:'✦'}</div><h2>${r?esc(r.name):'마음 선물'}이 도착했어!</h2><p class="muted" style="font-size:14px;margin:12px 0 22px">어떤 마음이든, 이야기해 준 너에게.<br>네 섬에 오늘의 기억을 놓아 보자.</p><button class="primary full" onclick="placeReward(${r?rewards.indexOf(r):0})">섬에 놓기 →</button><p class="small" style="margin-top:18px">등교 한 번, 하교 한 번 · 하루 최대 2개</p></div>`}
function nextMood(){if(mood<0)return toast('지금 마음과 가까운 색을 골라 줘.');step=1;renderChild()}
function sendStory(){answer=$('#answer').value.trim();if(!answer)return toast('짧게라도 네 이야기를 적어 줘.');chatReply=mood===0?'즐거웠던 일을 나눠 줬구나. 그때 느낀 마음을 오늘의 섬에 담아 볼까?':mood===3?'혼자 있고 싶은 마음도 말해 줘서 고마워. 네가 편한 만큼만 이야기해도 괜찮아.':'그런 일이 있었구나. 네가 느낀 마음을 이야기해 줘서 고마워.';step=2;renderChild()}
function requestMeeting(){if(requestSent)return toast('이미 면담을 신청했어요.');requestSent=true;toast('선생님 화면에 면담 신청이 표시돼요.');renderChild()}
function finishStory(){if(!completed[period]){let r=/축구|공을/.test(answer)?{name:'축구공',icon:'⚽'}:/꽃|식물/.test(answer)?{name:'꽃 화분',icon:'🌷'}:/책|읽/.test(answer)?{name:'책 더미',icon:'📚'}:{name:'작은 나무',icon:'🌳'};r.story=answer;r.mood=mood;rewards.push(r);completed[period]=r}step=3;renderChild()}
function placeReward(i){if(!rewards[i])return;placed=rewards[i].icon;renderChild();toast(rewards[i].name+'을 섬에 놓았어. 드래그해서 옮겨 봐!')}
function startPlace(){if(!rewards.length)return toast('등교 또는 하교 이야기를 마치고 소품을 받아 봐.');placeReward(rewards.length-1)}
function enableDrag(){const el=$('#placedItem');if(!el)return;el.onpointerdown=e=>{el.setPointerCapture(e.pointerId);el.onpointermove=ev=>{let r=$('#world').getBoundingClientRect();el.style.left=Math.max(5,Math.min(88,(ev.clientX-r.left)/r.width*100))+'%';el.style.top=Math.max(25,Math.min(73,(ev.clientY-r.top)/r.height*100))+'%'};el.onpointerup=()=>el.onpointermove=null}}
function village(){modal(`<span class="tag">학기말 마을 방문 · 미리 보기</span><h2 style="margin-top:16px">우리의 섬이 만나면</h2><p class="muted">서로 다른 퍼즐 조각이 모여 우리 반 마을이 돼요.</p><div class="village">${students.slice(0,6).map(n=>`<figure><img src="${island}" alt="${n}의 퍼즐 섬"><figcaption>${n.slice(1)}의 섬</figcaption></figure>`).join('')}</div><p class="small">실제 방문은 한 학기에 한 번 열려요.</p>`)}
const nav=[['dashboard','▦','대시보드'],['detail','☺','아이 상세'],['records','▤','업무 기록'],['parent','▧','학부모 상담'],['chatbot','✿','협진 챗봇']];
function go(p){page=p;renderTeacher()}
function renderTeacher(){$('#app').innerHTML=`<div class="teacher"><aside class="sidebar"><div class="classlabel"><div class="eyebrow">OUR CLASSROOM</div><h3>3학년 2반</h3><span class="small">윤선생님의 교실 · 28명</span></div>${nav.map(n=>`<button class="navbutton ${page===n[0]?'active':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('')}<div class="sidefoot">✿ 하루 두 번, 작은 안부<br>아이들의 마음을 살펴요.<br><br>시연용 데이터 · 실제 전송 없음</div></aside><main class="main"><div class="pagehead"><div><div class="eyebrow">SALPIM TEACHER'S DESK</div><h1>${({dashboard:'오늘도, 한 명 한 명 살핌',detail:'아이의 하루를 가까이',records:'업무 기록',parent:'학부모 상담',chatbot:'함께 살피는 협진 회의'})[page]}</h1><p>${({dashboard:'2026년 9월 14일 월요일 · 3학년 2반의 아침',detail:'자리를 선택하면 아이의 이야기가 펼쳐집니다.',records:'관찰과 상담, 회의의 흐름을 한곳에.',parent:'아이의 기록을 근거로, 보호자와 함께 이야기합니다.',chatbot:'학습 · 정서 · 가정환경의 관점에서 함께 살펴봅니다.'})[page]}</p></div>${page==='detail'?`<input class="date" aria-label="상담 일지 날짜" type="date" value="${activeDate}" onchange="activeDate=this.value;renderTeacher()">`:page==='dashboard'?'<span class="tag">오늘 등교 24 / 28</span>':''}</div><div id="teacherContent">${({dashboard:dashboard,detail:detail,records:recordPage,parent:parentPage,chatbot:chatPage})[page]()}</div></main></div>`}
function graph(){return `<svg class="chart" viewBox="0 0 430 155" role="img" aria-label="시연 데이터: 주차별 감정 어휘 수 4개, 6개, 5개, 9개, 12개"><g stroke="#eef1e8"><path d="M35 25H415M35 65H415M35 105H415"/></g><g><text x="4" y="29">12</text><text x="11" y="69">8</text><text x="11" y="109">4</text></g><path d="M40 105L130 85L220 95L310 55L405 25L405 123H40Z" fill="#edf3e2"/><path d="M40 105L130 85L220 95L310 55L405 25" fill="none" stroke="#81a15d" stroke-width="3"/><g fill="#81a15d">${[[40,105],[130,85],[220,95],[310,55],[405,25]].map(x=>`<circle cx="${x[0]}" cy="${x[1]}" r="4"/>`).join('')}</g><g>${['1주','2주','3주','4주','5주'].map((n,i)=>`<text x="${30+i*91}" y="148">${n}</text>`).join('')}</g></svg>`}
function relationship(){return `<svg class="map" viewBox="0 0 440 195" role="img" aria-label="예시 관계지도: 민준 지우 친밀, 지우 도윤 갈등, 서연 하윤 친밀"><g stroke="#bbd0a4" stroke-width="2"><path d="M85 85L205 57L335 85M85 85L182 157L310 155M335 85L310 155"/><path d="M205 57L182 157" stroke="#d68b73" stroke-dasharray="5 5"/></g>${[[85,85,'민준','#d9e9c4'],[205,57,'지우','#f3de9e'],[335,85,'서연','#d9e9c4'],[182,157,'도윤','#ecc3b6'],[310,155,'하윤','#d9e9c4']].map(n=>`<g><circle cx="${n[0]}" cy="${n[1]}" r="27" fill="${n[3]}"/><text text-anchor="middle" x="${n[0]}" y="${n[1]+5}">${n[2]}</text></g>`).join('')}</svg>`}
function dashboard(){return `<div class="dashboard"><section class="card brief"><div class="eyebrow">MORNING BRIEFING</div><h2>오늘은 세 아이에게<br>조금 더 안부를 건네 주세요.</h2><p>지우는 3일 연속 혼자 있고 싶다고 표현했어요.<br>서연과 도윤의 모둠 활동 이야기도 살펴봐 주세요.</p><div class="briefrow"><button class="secondary" style="font-size:13px;padding:10px" onclick="selectedStudent='이지우';go('detail')">이지우 살펴보기 ↗</button><span class="tag yellow">${requestSent?'민준 면담 신청 1건':'확인이 필요한 기록 3건'}</span></div></section><section class="card"><h3>오늘의 교실</h3><div class="weather"><span class="sun">☀</span><div><h2>대체로 편안한 아침</h2><p class="small">오늘 응답한 24명의 마음 색</p></div></div><div class="stackbar"><i style="width:58.3%"></i><i style="width:25%"></i><i style="width:8.3%"></i><i style="width:8.4%"></i></div><div class="legend"><span>초록 14</span><span>노랑 6</span><span>빨강 2</span><span>남색 2</span></div></section><section class="card"><div class="cardtitle"><h3>관계지도 & 갈등 기록</h3><span class="small">최근 7일 · 예시</span></div>${relationship()}<div class="flex small" style="justify-content:center;margin-bottom:15px"><span>― 함께한 이야기</span><span style="color:#b47f6e">┄ 갈등 기록</span></div><div class="lineitem"><span>지우 · 도윤 / 모둠 역할 정하기</span><button class="tag yellow" onclick="openRecord(1)">기록 보기</button></div></section><section class="card"><div class="cardtitle"><h3>패턴 살펴보기</h3><span class="tag yellow">확인 필요 3</span></div>${[['이지우','3일 연속 남색을 선택했어요.','혼자 있고 싶은 이유를 확인해 주세요.'],['박서연','발표 전날, 걱정 표현이 반복돼요.','상담 일지 3건에서 관찰됐어요.'],['최도윤','하교 때 빨강 선택이 늘었어요.','이번 주 2회 · 지난주 0회']].map(n=>`<div class="pattern"><div class="symbol">!</div><div><button style="font-weight:700;padding:0" onclick="selectedStudent='${n[0]}';go('detail')">${n[0]} ↗</button><p>${n[1]}</p><span class="small">${n[2]}</span></div></div>`).join('')}<p class="small" style="margin-top:16px">표현의 변화를 살피는 참고 정보입니다.</p></section><section class="card"><div class="cardtitle"><h3>감정 어휘의 성장</h3><span class="tag">4 → 12개</span></div><p class="small">학급 평균 · 주차별 사용한 감정 어휘 수</p>${graph()}<span class="small">“좋아요”에서 “뿌듯해요”, “서운해요”로</span></section><section class="card"><div class="cardtitle"><h3>전체 참여도</h3><span class="small">오늘</span></div><div class="stats"><div class="ring"><b>86%</b></div><div style="flex:1"><b>24명 / 28명</b><p class="small">등교 상담을 마쳤어요</p><div class="progress"><i style="width:86%"></i></div><p class="small">하교 상담 0 / 28 · 아직 시작 전</p></div></div><div class="lineitem"><span class="small">아직 참여하지 않은 아이</span><span style="font-size:13px">주원, 지호 외 2명</span></div></section></div>`}
function detail(){let today=activeDate==='2026-09-14',s=selectedStudent;return `<div class="detailgrid"><section class="card"><div class="cardtitle"><h3>우리 반 자리배치</h3><span class="small">3학년 2반</span></div><div class="board">칠판</div><div class="seats">${students.map((n,i)=>`<button class="seat ${s===n?'active':''}" onclick="selectedStudent='${n}';renderTeacher()"><span>${['🙂','😶','🙂','😐'][i%4]}</span>${n}</button>`).join('')}</div><p class="small" style="text-align:center;margin-top:22px">시연 화면에는 12개 자리를 표시했습니다.</p></section><section class="card"><div class="cardtitle"><div class="flex"><span class="avatar">☺</span><h2>${s}</h2></div><span class="tag">${activeDate}</span></div>${!today?'<div class="log"><p class="muted">선택한 날짜의 상담 기록이 없습니다.</p></div>':`<div class="log"><div class="flex between"><h3>☀ 등교 상담</h3><span class="small">08:42</span></div><div class="tag" style="margin-top:13px">${s==='김민준'&&completed.am?moods[completed.am.mood][0]+' · '+moods[completed.am.mood][1]:s==='이지우'?'남색 · 혼자 있고 싶어요':'초록 · 기분 좋아요'}</div><p>“${esc(s==='김민준'&&completed.am?completed.am.story:s==='이지우'?'오늘은 쉬는 시간에 혼자 책을 읽고 싶어요.':'어제 축구를 했는데 너무 재밌었어요. 오늘도 친구들이랑 하고 싶어요.')}”</p><span class="small">살핌이 · ${s==='이지우'?'혼자 있는 시간이 필요하구나. 어떤 마음인지 조금 들려줄래?':'친구들과 축구해서 즐거웠구나.'}</span></div><div class="log"><h3>☾ 하교 상담</h3><p class="${s==='김민준'&&completed.pm?'':'muted'}">${s==='김민준'&&completed.pm?esc(completed.pm.story):'아직 하교 이야기가 도착하지 않았어요.'}</p>${s==='김민준'&&requestSent?'<span class="tag yellow">선생님과 면담하고 싶어요 · 신청됨</span>':''}</div>`}<div class="log"><div class="flex between"><h3>선생님의 한마디</h3><button class="tag" onclick="draftComment()">✦ AI 초안</button></div><textarea aria-label="아이에게 보낼 코멘트" id="comment" rows="3" style="margin-top:14px" placeholder="초안을 불러오거나 직접 적어 주세요.">${esc(comments[s]||'')}</textarea><div class="flex between" style="margin-top:14px"><span class="small">확인하고 수정한 뒤 보내 주세요.</span><button class="primary" style="font-size:14px;padding:11px 17px" onclick="sendComment()">코멘트 보내기</button></div></div></section></div>`}
function draftComment(){$('#comment').value=selectedStudent.slice(1)+'아, 오늘 마음을 들려줘서 고마워. 선생님과 이야기하고 싶을 때 편하게 알려 줘.'}
function sendComment(){let t=$('#comment').value.trim();if(!t)return toast('보낼 코멘트를 입력해 주세요.');comments[selectedStudent]=t;toast('시연 화면에 코멘트를 반영했습니다. 실제 전송은 되지 않습니다.')}
function recordPage(){return `<div class="tools"><input id="recordSearch" aria-label="기록 검색" placeholder="⌕ 아이 이름, 기록 내용 검색" oninput="filterRecords()"><input type="date" id="recordDate" aria-label="기록 날짜" style="flex:0 0 165px" onchange="filterRecords()"><select id="recordType" aria-label="기록 유형" onchange="filterRecords()"><option value="">모든 기록</option>${['학생 상담','갈등 기록','협진 회의','학부모 상담'].map(x=>`<option>${x}</option>`).join('')}</select><select id="archiveFilter" aria-label="보관 상태" onchange="filterRecords()"><option value="all">전체 보관 상태</option><option value="active">진행 중</option><option value="archived">아카이브</option></select><button class="primary" onclick="newRecord()">+ 기록하기</button></div><section class="card" style="padding:8px"><div class="tablewrap"><table><thead><tr><th>날짜 · 시각</th><th>구분</th><th>기록</th><th>상태</th><th></th></tr></thead><tbody id="recordRows">${recordRows(records)}</tbody></table></div></section>`}
function recordRows(rs){return rs.length?rs.map(r=>`<tr onclick="openRecord(${records.indexOf(r)})"><td>${r.date}<div class="small">${r.time}</div></td><td><span class="tag ${r.type==='갈등 기록'?'yellow':r.type==='협진 회의'?'blue':''}">${r.type}</span></td><td class="title">${esc(r.title)}</td><td class="small">${r.arch?'아카이브':'진행 중'}</td><td>↗</td></tr>`).join(''):'<tr><td colspan="5" style="text-align:center;padding:40px">검색 결과가 없습니다.</td></tr>'}
function filterRecords(){let q=$('#recordSearch').value.trim(),d=$('#recordDate').value,t=$('#recordType').value,a=$('#archiveFilter').value;$('#recordRows').innerHTML=recordRows(records.filter(r=>(!q||(r.title+r.body).includes(q))&&(!d||r.date===d)&&(!t||r.type===t)&&(a==='all'||r.arch===(a==='archived'))))}
function newRecord(){modal(`<h2>새 업무 기록</h2><label>기록 유형</label><select id="newType"><option>학생 상담</option><option>갈등 기록</option><option>협진 회의</option></select><label>제목</label><input id="newTitle" placeholder="아이 이름과 주제를 적어 주세요"><label>내용</label><textarea id="newBody" rows="5" placeholder="관찰 내용과 상담 내용을 기록하세요.\n협진 회의: 학습 / 정서 / 가정환경"></textarea><button class="primary full" style="margin-top:19px" onclick="saveRecord()">기록 저장</button>`)}
function saveRecord(){let t=$('#newTitle').value.trim(),b=$('#newBody').value.trim();if(!t||!b)return toast('제목과 내용을 입력해 주세요.');let now=new Date();records.unshift({date:now.toLocaleDateString('sv-SE'),time:now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false}),type:$('#newType').value,title:t,student:'',body:b,arch:false});closeModal();renderTeacher();toast('기록을 추가했습니다. 이 시연 화면에서만 유지됩니다.')}
function openRecord(i){let r=records[i];modal(`<span class="tag">${r.type}</span><h2 style="margin-top:16px">${esc(r.title)}</h2><p class="small">${r.date} ${r.time} · 윤선생님</p><p style="white-space:pre-wrap;margin:25px 0">${esc(r.body)}</p><button class="secondary" onclick="records[${i}].arch=!records[${i}].arch;closeModal();renderTeacher();toast('보관 상태를 변경했습니다.')">${r.arch?'진행 중으로 복원':'아카이브로 옮기기'}</button>`)}
function parentPage(){return `<div class="parentgrid"><section class="card"><h3>상담할 아이 불러오기</h3><input aria-label="아이 멘션 검색" id="mentionInput" placeholder="@아이 이름을 입력하세요" value="${parentStudent?'@'+parentStudent:''}" style="margin-top:17px" oninput="mentionSearch(this.value)"><div id="mentionResults"></div><div id="parentEvidence">${evidence()}</div></section><section class="card"><div class="cardtitle"><h3>보호자 상담 기록</h3><span class="tag">상담 노트</span></div><label class="small" for="parentDate">상담 날짜</label><input type="date" id="parentDate" value="2026-09-14" style="margin:7px 0 20px"><label class="small" for="parentNote">상담 내용</label><textarea id="parentNote" rows="12" style="margin-top:7px" placeholder="보호자가 전한 이야기, 함께 확인한 내용, 이후 살펴볼 점을 적어 주세요."></textarea><button class="primary full" style="margin-top:18px" onclick="saveParent()">상담 기록 저장</button></section></div>`}
function mentionSearch(v){let q=v.replace('@','');$('#mentionResults').innerHTML=students.filter(n=>n.includes(q)).slice(0,5).map(n=>`<button class="secondary" style="margin:8px 5px 0 0" onclick="selectParent('${n}')">@${n}</button>`).join('')||'<p class="small">일치하는 아이가 없습니다.</p>'}
function selectParent(n){parentStudent=n;$('#mentionInput').value='@'+n;$('#mentionResults').innerHTML='';$('#parentEvidence').innerHTML=evidence()}
function evidence(){if(!parentStudent)return '<p class="muted" style="padding:65px 0;text-align:center">@아이를 선택하면 상담 정보와<br>감정 어휘 그래프를 함께 불러옵니다.</p>';return `<div class="mention"><b>@${parentStudent}</b> · 3학년 2반<div class="small" style="margin-top:5px">상담 근거 자료 · 시연용 예시</div></div><h3 style="margin-top:23px">감정 어휘 성장</h3>${graph()}<div class="log"><h3>최근 상담 정보</h3><p>${esc(parentStudent==='김민준'&&completed.am?completed.am.story:'학교에서 친구들과 함께한 활동에 대해 이야기했어요.')}</p><span class="small">9월 14일 · 등교 상담</span></div><div class="log"><p>지난 상담 · ${esc(records.find(r=>r.student===parentStudent)?.body||'이전 상담 기록이 없습니다.')}</p></div><button class="secondary full" onclick="extractEvidence()">상담 근거 자료 추출 ↗</button>`}
function extractEvidence(){modal(`<h2>${parentStudent} · 상담 근거 자료</h2><span class="tag">추출 미리 보기</span><p style="margin-top:20px">감정 어휘 성장 · 5주간 4 → 12개</p>${graph()}<h3>등교 상담 · 9월 14일</h3><p style="margin-top:10px">${esc(parentStudent==='김민준'&&completed.am?completed.am.story:'학교에서 친구들과 함께한 활동에 대해 이야기했어요.')}</p><p class="small" style="margin-top:25px">시연용 자료입니다. 추출 결과의 화면 구성을 확인할 수 있습니다.</p>`)}
function saveParent(){if(!parentStudent)return toast('@아이를 먼저 선택해 주세요.');let b=$('#parentNote').value.trim();if(!b)return toast('상담 내용을 입력해 주세요.');records.unshift({date:$('#parentDate').value,time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false}),type:'학부모 상담',title:parentStudent+' 보호자 · 상담 기록',student:parentStudent,body:b,arch:false});$('#parentNote').value='';toast('업무 기록에 상담을 추가했습니다.')}
function chatPage(){return `<section class="agentpanel"><div class="card brief"><h3>한 아이를, 세 가지 관점으로</h3><p class="small" style="margin-top:9px">관찰한 상황을 입력하면 학습 · 정서 · 가정환경 담당 에이전트의 답변을 함께 확인합니다.</p></div><div id="agentMessages"><div class="agentbubble"><div class="flex"><span class="agenticon">✿</span><b>살핌 협진</b></div><p>어떤 아이의 어떤 상황을 함께 살펴볼까요?</p><button class="tag" style="margin-top:14px;text-align:left" onclick="$('#agentPrompt').value='서연이가 발표를 앞두면 걱정된다고 해요. 어떻게 도와주면 좋을까요?'">서연이가 발표를 앞두면 걱정된다고 해요.</button></div></div><div class="compose"><textarea aria-label="협진 질문" id="agentPrompt" placeholder="함께 살펴볼 상황을 적어 주세요."></textarea><div class="flex between"><span class="small">학습 / 정서 / 가정환경 · AI 응답 예시</span><button class="primary" style="padding:10px 18px" onclick="askAgents()">함께 살펴보기 ↑</button></div></div></section>`}
function askAgents(){let q=$('#agentPrompt').value.trim();if(!q)return toast('함께 살펴볼 상황을 입력해 주세요.');$('#agentMessages').innerHTML=`<div class="reply">${esc(q)}</div>${[['학습','▦','과제의 어떤 부분에서 어려움을 느끼는지 구체적으로 확인해 보세요. 발표라면 준비와 발표 자체를 나누어, 부담이 생기는 지점을 먼저 물어볼 수 있어요.'],['정서','♡','아이의 표현을 그대로 듣고 어떤 순간에 그 마음이 커지는지 물어보세요. 바로 해결책을 주기 전에 아이가 원하는 도움을 확인해 주세요.'],['가정환경','⌂','현재 정보만으로 가정 상황을 추정하기는 어려워요. 필요하다면 보호자에게 최근 생활의 변화가 있었는지 열린 질문으로 확인해 보세요.']].map(n=>`<div class="agentbubble"><div class="flex"><span class="agenticon">${n[1]}</span><b>${n[0]} 담당 에이전트</b><span class="tag">응답 예시</span></div><p>${n[2]}</p></div>`).join('')}<p class="small">고정된 시연 응답입니다. 입력 상황을 실제 분석하지 않습니다.</p>`;$('#agentPrompt').value=''}
function modal(c){$('#modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="상세 보기"><div style="text-align:right"><button aria-label="닫기" style="font-size:25px" onclick="closeModal()">×</button></div>${c}</section></div>`;$('#modalRoot button').focus()}
function closeModal(){$('#modalRoot').innerHTML=''}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
</script></body></html>
