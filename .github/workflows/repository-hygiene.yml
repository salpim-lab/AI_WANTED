name: Repository hygiene

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tracked-files-and-task-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          package-manager-cache: false
      - name: Block Salesforce files
        run: node scripts/check-repo-files.mjs
      - name: Require a task journal in PRs
        if: github.event_name == 'pull_request'
        run: node scripts/check-task-log.mjs
